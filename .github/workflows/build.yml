name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Portlibs
        # the image already has them; only go to pkg.devkitpro.org (which
        # sometimes refuses CI runners) when something is missing
        run: |
          pkgs="switch-curl switch-libjson-c switch-sdl2 switch-sdl2_ttf switch-sdl2_image"
          dkp-pacman -Q $pkgs >/dev/null 2>&1 || dkp-pacman -Sy --noconfirm --needed $pkgs

      - name: Build
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: switch-discord-activity-${{ github.sha }}
          path: |
            out/switch-discord-activity-*.zip
            out/SHA256SUMS
