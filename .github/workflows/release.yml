name: Release

# Publishes a GitHub release for the version in include/config.h
# (SWITCHRPC_VERSION), with the SD card zip plus the loose files and
# SHA256SUMS the app's "Check for updates" installs from.
#
# Runs on every push to main and does nothing if that version is already
# released, so bumping the version and pushing is enough. Pushing a tag
# vX.Y.Z (matching the version) works too.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and release state
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*SWITCHRPC_VERSION "\(.*\)"/\1/p' include/config.h)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != v$v in include/config.h"; exit 1
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Portlibs
        # the image already has them; only go to pkg.devkitpro.org (which
        # sometimes refuses CI runners) when something is missing
        run: |
          pkgs="switch-curl switch-libjson-c switch-sdl2 switch-sdl2_ttf switch-sdl2_image"
          dkp-pacman -Q $pkgs >/dev/null 2>&1 || dkp-pacman -Sy --noconfirm --needed $pkgs

      - name: Build
        run: make dist

      - name: Release notes from CHANGELOG.md
        run: |
          tag=${{ needs.check.outputs.tag }}
          v=${tag#v}
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Switch Discord Activity $tag" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            out/switch-discord-activity-*.zip
            out/exefs.nsp
            out/switch-discord-activity.nro
            out/switch-discord-activity.ovl
            out/SHA256SUMS
